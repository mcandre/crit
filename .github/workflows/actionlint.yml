---
name: "Actionlint"
on: # yamllint disable-line rule:truthy
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: "read"
  issues: "write"
  pull-requests: "write"
jobs:
  Actionlint:
    runs-on: "ubuntu-26.04"
    steps:
    - uses: "actions/checkout@v4"
    - uses: "raven-actions/actionlint@v2"
